name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    # Release PRs are generated (version bumps + changelog) — CI adds nothing
    # there: the same workspace sources are already green on master, and the
    # failure classes CI could catch (files globs, cross-package exports) only
    # manifest at npm-install time, not in the workspace. paths-ignore keeps
    # required-check exemption semantics for real code PRs.
    paths-ignore:
      - "**/CHANGELOG.md"
      - "**/package.json"
      - ".release-please-manifest.json"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & format
        run: pnpm check

      - name: Type check
        run: pnpm typecheck

      - name: Test (every package)
        run: pnpm test
