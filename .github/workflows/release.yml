name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview version bump without publishing
        type: boolean
        default: true

permissions:
  id-token: write
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: set-matrix
        run: |
          pkgs=$(ls -1 packages | jq -R -s -c 'split("\n") | map(select(length>0))')
          echo "matrix=$pkgs" >> "$GITHUB_OUTPUT"
  release:
    needs: [verify, discover]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Semantic Release (${{ matrix.package }})
        working-directory: packages/${{ matrix.package }}
        run: npx semantic-release -e semantic-release-monorepo --tag-format "${{ matrix.package }}-v\${version}"${{ inputs.dry-run && ' --dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}