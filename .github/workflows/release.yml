name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: master

      # Only publish after release-please has created a release (post-merge).
      - name: Checkout
        if: ${{ steps.release.outputs.releases_created }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        if: ${{ steps.release.outputs.releases_created }}
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: ${{ steps.release.outputs.releases_created }}
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        if: ${{ steps.release.outputs.releases_created }}
        run: pnpm install

      # pnpm resolves workspace:* and catalog: to real versions at publish time.
      # --provenance uses the OIDC id-token granted above.
      - name: Publish to npm
        if: ${{ steps.release.outputs.releases_created }}
        run: pnpm publish -r --access public --no-git-checks --provenance
