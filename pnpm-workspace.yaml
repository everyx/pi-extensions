packages:
  - packages/*

catalog:
  '@earendil-works/pi-ai': '^0.84.0'
  '@earendil-works/pi-coding-agent': '^0.84.0'
  '@earendil-works/pi-tui': '^0.84.0'
  typebox: '^1.3.6'

allowBuilds:
  '@google/genai': true
  esbuild: true
  protobufjs: true
# pnpm's minimum-release-age policy (default 7 days) blocks freshly published
# packages; this set is auto-maintained by pnpm while the pi 0.84.0 release
# (devDependencies, plus transitive @earendil-works deps not named in
# package.json) is within the guard window.
minimumReleaseAgeExclude:
  - '@earendil-works/pi-agent-core@0.84.0'
  - '@earendil-works/pi-ai@0.84.0'
  - '@earendil-works/pi-client@0.84.0'
  - '@earendil-works/pi-coding-agent@0.84.0'
  - '@earendil-works/pi-protocol@0.84.0'
  - '@earendil-works/pi-telemetry@0.84.0'
  - '@earendil-works/pi-tui@0.84.0'